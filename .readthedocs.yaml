# Сборка корня https://docs.inkov.dev/ на Read the Docs.
# Документация проектов подключена к этому проекту как subprojects: /projects/<alias>/.
# Справка: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"

mkdocs:
  configuration: mkdocs.yml
  # Любое предупреждение (битая ссылка, страница вне навигации)
  # останавливает сборку, опубликованной остается предыдущая версия сайта
  fail_on_warning: true

python:
  install:
    - requirements: requirements-docs.txt
